version: "2.0"

simulation_types:
  encounter_margin:
    display_name: Encounter Margin Forecast
    description: Project monthly encounter direct margin with volume growth and cost inflation trends.
    model_template: encounter_margin_forecast
    schema: "batch_id long, trial_id long, month string, simulated_direct_margin double, simulated_encounter_volume double, simulated_margin_per_encounter double"
    parameters:
      growth_rate:
        default: 0.02
        description: Annual encounter volume growth rate.
      cost_inflation:
        default: 0.035
        description: Annual cost inflation rate.
      num_months:
        default: 12
        description: Forecast horizon in months.
    distributions:
      monthly_margin:
        description: Monthly total direct margin distribution
        default_spec: {type: normal, params: {loc: 4500000, scale: 900000}}
      encounter_volume:
        description: Monthly encounter count distribution
        default_spec: {type: normal, params: {loc: 6250, scale: 800}}
      cost_per_encounter:
        description: Average cost per encounter (lognormal)
        default_spec: {type: lognormal, params: {mean: 7.5, sigma: 0.3}}
    aggregation:
      value_column: simulated_direct_margin
      group_column: month
      additional_metrics:
        - value_column: simulated_margin_per_encounter
          group_column: month

  wh_margin_comparison:
    display_name: WH Margin Comparison
    description: Compare per-encounter direct margins between Women's Health and non-WH populations under different penetration scenarios.
    model_template: wh_margin_cohort
    schema: "batch_id long, trial_id long, scenario string, simulated_margin_per_encounter double, simulated_direct_margin double, simulated_encounter_count double"
    parameters:
      total_encounters:
        default: 75000
        description: Total annual encounter volume.
      wh_penetration:
        default: 0.35
        description: Current Women's Health population fraction.
      wh_penetration_target:
        default: 0.50
        description: Target WH penetration in the expanded scenario.
      num_months:
        default: 12
        description: Projection horizon in months.
    distributions:
      wh_margin:
        description: Per-encounter direct margin for Women's Health population
        default_spec: {type: normal, params: {loc: 850, scale: 200}}
      non_wh_margin:
        description: Per-encounter direct margin for non-WH population
        default_spec: {type: normal, params: {loc: 620, scale: 180}}
    aggregation:
      value_column: simulated_margin_per_encounter
      group_column: scenario
      additional_metrics:
        - value_column: simulated_direct_margin
          group_column: scenario
