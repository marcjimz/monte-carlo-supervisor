version: "1.0"

simulation_types:
  patient_volume:
    display_name: Patient Volume
    description: Simulate monthly patient encounter volume with growth and seasonality trends for women's health services.
    model_template: normal_timeseries
    schema: "batch_id long, trial_id long, month string, simulated_encounters double"
    parameters:
      monthly_mean:
        default: 4200
        description: Average encounters per month.
      monthly_std:
        default: 600
        description: Standard deviation of encounters per month.
      growth_rate:
        default: 0.03
        description: Year-over-year growth rate.
      seasonality_amp:
        default: 0.08
        description: Amplitude of seasonal sine wave.
      num_months:
        default: 12
        description: Forecast horizon in months.
    aggregation:
      value_column: simulated_encounters
      group_column: month

  revenue:
    display_name: Revenue Projection
    description: Simulate monthly revenue and charges for women's health services accounting for denial rates.
    model_template: revenue_projection
    schema: "batch_id long, trial_id long, month string, simulated_revenue double, simulated_charges double"
    parameters:
      avg_monthly_revenue:
        default: 5000000
        description: Baseline monthly revenue.
      revenue_std:
        default: 800000
        description: Standard deviation of monthly revenue.
      avg_charge_to_rev:
        default: 1.35
        description: Charge-to-revenue ratio.
      denial_rate:
        default: 0.08
        description: Claim denial rate.
      num_months:
        default: 12
        description: Forecast horizon in months.
    aggregation:
      value_column: simulated_revenue
      group_column: month

  cost_comparison:
    display_name: Cost Comparison
    description: Compare projected costs between virtual and in-person care for women's health conditions.
    model_template: cohort_cost_comparison
    schema: "batch_id long, trial_id long, care_model string, simulated_cost_per_encounter double, simulated_total_cost double, simulated_encounter_count double"
    parameters:
      baseline_cost_inperson:
        default: 1200
        description: Average cost per in-person encounter.
      projected_cost_virtual:
        default: 450
        description: Projected average cost per virtual encounter.
      cost_std_fraction:
        default: 0.25
        description: Cost uncertainty as fraction of mean.
      member_count:
        default: 50000
        description: Covered population size.
      virtual_penetration:
        default: 0.30
        description: Fraction of eligible patients using virtual care.
      annual_encounter_rate:
        default: 2.5
        description: Average encounters per member per year.
      num_months:
        default: 12
        description: Projection horizon in months.
    aggregation:
      value_column: simulated_cost_per_encounter
      group_column: care_model
      additional_metrics:
        - value_column: simulated_total_cost
          group_column: care_model

  system_cost_roi:
    display_name: System Cost ROI
    description: Project total system cost reduction and ROI from virtual care partnership.
    model_template: multi_year_roi_projection
    schema: "batch_id long, trial_id long, year int, simulated_baseline_cost double, simulated_reduced_cost double, simulated_gross_savings double, simulated_net_savings double, simulated_roi double"
    parameters:
      baseline_annual_cost:
        default: 500000000
        description: Total annual women's health system cost.
      encounter_reduction_pct:
        default: 0.08
        description: Percent reduction in encounters (e.g. 0.08 = 8%).
      labor_inflation_rate:
        default: 0.04
        description: Annual labor cost inflation rate.
      expense_inflation:
        default: 0.03
        description: Annual non-labor expense inflation rate.
      include_surgery:
        default: false
        description: Include surgical costs in the reduction model.
      solution_cost:
        default: 2000000000
        description: Total partnership investment cost over projection period.
      num_years:
        default: 5
        description: Projection horizon in years.
      labor_fraction:
        default: 0.55
        description: Fraction of cost attributable to labor.
      surgical_fraction:
        default: 0.15
        description: Fraction of cost from surgical encounters.
    aggregation:
      value_column: simulated_roi
      group_column: year
      additional_metrics:
        - value_column: simulated_net_savings
          group_column: year
        - value_column: simulated_gross_savings
          group_column: year
