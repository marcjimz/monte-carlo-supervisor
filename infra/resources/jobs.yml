resources:
  jobs:
    monte_carlo_pipeline:
      name: "monte-carlo-simulation-pipeline"
      description: "Spark-distributed Monte Carlo simulation pipeline with caching and Delta Lake storage"
      tags:
        project: monte-carlo-supervisor
      trigger:
        table_update:
          table_names:
            - ${var.catalog}.${var.schema}.simulation_runs
          condition: ANY_UPDATED
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: dispatch
          notebook_task:
            notebook_path: ../../notebooks/jobs/mc_00_dispatch.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: validate_and_check_cache
          depends_on:
            - task_key: dispatch
          notebook_task:
            notebook_path: ../../notebooks/jobs/mc_01_validate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: run_simulation
          depends_on:
            - task_key: validate_and_check_cache
          notebook_task:
            notebook_path: ../../notebooks/jobs/mc_02_simulate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: aggregate_results
          depends_on:
            - task_key: run_simulation
          notebook_task:
            notebook_path: ../../notebooks/jobs/mc_03_aggregate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

      parameters:
        - name: simulation_type
          default: "encounter_margin"
        - name: parameters
          default: "{}"
        - name: num_simulations
          default: "10000"
        - name: seed
          default: "42"

    data_pipeline:
      name: "monte-carlo-data-pipeline"
      description: "Load data, create tables/views, fit distributions"
      tags:
        project: monte-carlo-supervisor
      tasks:
        - task_key: load_data
          notebook_task:
            notebook_path: ../../notebooks/setup/01_generate_synthetic_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              skip_synthetic: ${var.skip_synthetic}
              app_sp_client_id: ${resources.apps.monte_carlo_ui.service_principal_client_id}

        - task_key: create_sim_tables
          depends_on:
            - task_key: load_data
          notebook_task:
            notebook_path: ../../notebooks/setup/01a_create_simulation_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: create_views
          depends_on:
            - task_key: load_data
          notebook_task:
            notebook_path: ../../notebooks/setup/02a_create_views.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${resources.sql_warehouses.mc_warehouse.id}
              skip_views: ${var.skip_views}

        - task_key: fit_distributions
          depends_on:
            - task_key: load_data
            - task_key: create_sim_tables
          notebook_task:
            notebook_path: ../../notebooks/setup/03_fit_distributions.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              metric_view: ${var.metric_view}

        - task_key: activate_trigger
          depends_on:
            - task_key: create_sim_tables
          notebook_task:
            notebook_path: ../../notebooks/setup/05_activate_trigger.py
            base_parameters:
              simulation_job_id: ${resources.jobs.monte_carlo_pipeline.id}

    genie_import:
      name: "monte-carlo-genie-import"
      description: "Deploy Genie Space + dashboard publish/embed"
      tags:
        project: monte-carlo-supervisor
      tasks:
        - task_key: deploy_genie
          notebook_task:
            notebook_path: ../../notebooks/setup/02_deploy_genie_space.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${resources.sql_warehouses.mc_warehouse.id}
              target_genie_space_id: ${var.genie_space_id}
              app_sp_client_id: ${resources.apps.monte_carlo_ui.service_principal_client_id}
