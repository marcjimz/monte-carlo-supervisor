resources:
  jobs:
    monte_carlo_pipeline:
      name: "monte-carlo-simulation-pipeline"
      description: "Spark-distributed Monte Carlo simulation pipeline with caching and Delta Lake storage"
      tags:
        project: monte-carlo-supervisor
      trigger:
        table_update:
          table_names:
            - ${var.catalog}.${var.schema}.simulation_runs
          condition: ANY_UPDATED
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: dispatch
          notebook_task:
            notebook_path: ../../notebooks/jobs/mc_00_dispatch.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: validate_and_check_cache
          depends_on:
            - task_key: dispatch
          notebook_task:
            notebook_path: ../../notebooks/jobs/mc_01_validate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: run_simulation
          depends_on:
            - task_key: validate_and_check_cache
          notebook_task:
            notebook_path: ../../notebooks/jobs/mc_02_simulate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: aggregate_results
          depends_on:
            - task_key: run_simulation
          notebook_task:
            notebook_path: ../../notebooks/jobs/mc_03_aggregate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

      parameters:
        - name: simulation_type
          default: "patient_volume"
        - name: parameters
          default: "{}"
        - name: num_simulations
          default: "10000"
        - name: seed
          default: "42"

    setup_pipeline:
      name: "monte-carlo-setup-pipeline"
      description: "One-click setup: loads data, creates schema objects, deploys Genie Space, configures app"
      tags:
        project: monte-carlo-supervisor
      tasks:
        # Phase 1: Data (depends on DAB-managed catalog/schema)
        - task_key: load_data
          notebook_task:
            notebook_path: ../../notebooks/setup/01_generate_synthetic_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Phase 2: Schema objects (SQL files)
        - task_key: create_sim_tables
          depends_on:
            - task_key: load_data
          sql_task:
            file:
              path: ../../infra/sql/create_simulation_tables.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
            warehouse_id: ${var.warehouse_id}

        - task_key: create_base_views
          depends_on:
            - task_key: load_data
          sql_task:
            file:
              path: ../../infra/sql/create_base_views.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
            warehouse_id: ${var.warehouse_id}

        - task_key: create_metric_views
          depends_on:
            - task_key: create_base_views
          sql_task:
            file:
              path: ../../infra/sql/create_metric_views.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
            warehouse_id: ${var.warehouse_id}

        # Phase 3: Computation
        - task_key: fit_distributions
          depends_on:
            - task_key: load_data
            - task_key: create_sim_tables
          notebook_task:
            notebook_path: ../../notebooks/setup/03_fit_distributions.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Phase 4: Genie Space (import from versioned JSON export)
        - task_key: deploy_genie
          depends_on:
            - task_key: create_metric_views
            - task_key: create_sim_tables
          notebook_task:
            notebook_path: ../../notebooks/setup/02_deploy_genie_space.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              target_genie_space_id: ${var.genie_space_id}

        # Phase 5: App wiring (runtime-only: Lakebase setup, permissions, dashboard)
        - task_key: configure_app
          depends_on:
            - task_key: deploy_genie
            - task_key: fit_distributions
          notebook_task:
            notebook_path: ../../notebooks/setup/04_configure_app.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              app_name: ${resources.apps.monte_carlo_ui.name}
              lakebase_project: ${resources.postgres_projects.monte_carlo_db.project_id}
