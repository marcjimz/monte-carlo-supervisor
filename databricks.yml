bundle:
  name: monte-carlo-supervisor

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: "monte_carlo_sim"
  schema:
    description: "Unity Catalog schema name"
    default: "hospital_data"

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - infra/resources/*.yml

sync:
  include:
    - notebooks/**/*.py
    - src/**/*.py
    - src/**/*.yaml
    - data/**/*.csv

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
    variables:
      catalog: monte_carlo_sim
      schema: hospital_data
