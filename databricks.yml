bundle:
  name: monte-carlo-supervisor

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: "monte_carlo_supervisor_catalog"
  schema:
    description: "Unity Catalog schema name"
    default: "hospital_data"
  warehouse_id:
    description: "SQL Warehouse ID for the dashboard"
    lookup:
      warehouse: "Serverless Starter Warehouse"

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - infra/resources/*.yml

sync:
  include:
    - notebooks/**/*.py
    - src/**/*.py
    - src/**/*.yaml
    - data/**/*.csv
    - dist/*.whl
    - app/**
    - dashboards/**
  exclude:
    - app/frontend/node_modules/**
    - app/frontend/src/**
    - app/frontend/public/**
    - app/.venv/**
    - app/**/__pycache__/**

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/marcin.jimenez@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakebase_hls_workshop_catalog
      schema: hospital_data
