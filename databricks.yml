bundle:
  name: monte-carlo-supervisor

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: "marcjimz_ih_demo_v1_catalog"
  schema:
    description: "Unity Catalog schema name"
    default: "hospital_data"
  genie_space_id:
    description: "Genie Space ID for agent analytics queries (empty = discover at runtime)"
    default: ""
  skip_synthetic:
    description: "Skip synthetic data generation (true for customer deployments)"
    default: "false"
  metric_view:
    description: "Fully qualified metric view name (e.g. gold_dev.core.project_accelerate_encounters_metrics)"
    default: ""
  skip_views:
    description: "Skip base/metric view creation (true if customer has existing metric view)"
    default: "false"

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - infra/resources/*.yml

sync:
  include:
    - notebooks/**/*.py
    - src/**/*.py
    - src/**/*.yaml
    - data/**/*.csv
    - dist/*.whl
    - app/**
    - dashboards/**
    - infra/sql/**
    - infra/genie/**
  exclude:
    - app/frontend/node_modules/**
    - app/frontend/src/**
    - app/frontend/public/**
    - app/frontend/*.json
    - app/frontend/*.ts
    - app/frontend/*.html
    - app/.venv/**
    - app/.databricks/**
    - app/tests/**
    # app/migrations/** must NOT be excluded — needed for Lakebase schema setup
    - app/**/__pycache__/**
    - app/**/*.zip
    - app/pyproject.toml

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/marcin.jimenez@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakebase_hls_workshop_catalog
      schema: hospital_data
      skip_synthetic: "true"
