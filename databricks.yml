bundle:
  name: monte-carlo-supervisor

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: "monte_carlo"
  schema:
    description: "Unity Catalog schema name"
    default: "default"

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - infra/resources/*.yml

permissions:
  - user_name: ${workspace.current_user.userName}
    level: CAN_MANAGE

sync:
  include:
    - notebooks/**/*.py
    - src/**/*.py
    - src/**/*.yaml
    - data/**/*.csv

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/marcin.jimenez@databricks.com/.bundle/${bundle.name}/${bundle.target}
