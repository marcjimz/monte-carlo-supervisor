[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-supervisor"
version = "1.0.0"
description = "Hospital encounter analytics and Monte Carlo simulation supervisor on Databricks"
requires-python = ">=3.10"
dependencies = []  # No runtime deps — serverless has numpy/pandas pre-installed

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.58.0",
    "databricks-langchain>=0.1.0",
    "mlflow>=2.12.0",
]
fitting = [
    "scipy>=1.11.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "scipy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["mc_supervisor", "mc_supervisor.*"]

[tool.setuptools.package-data]
mc_supervisor = ["**/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
