[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-supervisor"
version = "1.0.0"
description = "Hospital encounter analytics and Monte Carlo simulation supervisor on Databricks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "faker>=28.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.58.0",
    "databricks-langchain>=0.1.0",
    "mlflow>=2.12.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
