command:
  - uvicorn
  - app:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: SEED_DEMO_DATA
    value: "true"
  - name: SUPERVISOR_ENDPOINT
    value: "databricks-claude-opus-4-7"
  - name: EXECUTOR_ENDPOINT
    value: "databricks-claude-sonnet-4"
  - name: PGDATABASE
    value: "mcapp"
  # Resource binding references — resolved at runtime by the platform
  - name: SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: SIMULATION_JOB_ID
    valueFrom: simulation-job
